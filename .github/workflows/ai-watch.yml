name: AI Watch Telegram Bot

on:
  schedule:
    # UTC. Deux créneaux par slot pour couvrir heure d'été ET d'hiver ;
    # main.py (--mode auto) ne s'exécute que dans le bon créneau Paris et jamais 2 fois.
    - cron: "5 6-13 * * *"     # matin  -> 8h Paris
    - cron: "5 15-21 * * *"   # soir   -> 17h Paris
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode (auto = selon l'heure de Paris)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - evening

concurrency:
  group: ai-watch
  cancel-in-progress: false

jobs:
  run-ai-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python main.py --mode "${{ github.event.inputs.mode || 'auto' }}"

      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seen_items.json items_history.json feedback.json bot_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update bot state"
          git pull --rebase || true
          git push
